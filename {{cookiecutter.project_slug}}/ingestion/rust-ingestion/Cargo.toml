[package]
name = "rust-ingestion"
version = "0.1.0"
edition = "2021"

[dependencies]
csv = "1.3"
tokio = { version = "1.28", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
thiserror = "1.0"
config = { version = "0.13", features = ["yaml"] }
hmac = "0.12"
sha2 = "0.10"
redis = { version = "0.28.2", features = ["async-std-comp"] }
deadpool = "0.12.2"
deadpool-redis = "0.18.0"
futures = "0.3"
aws-config = { version = "1.1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.15"
rdkafka = "0.38.0"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tungstenite = "0.21"
futures-util = "0.3"
url = "2.5"

[dev-dependencies]
mockall = "0.13"
tokio-test = "0.4"
tempfile = "3.8"
