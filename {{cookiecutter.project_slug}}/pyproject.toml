[tool.ruff]
# Python version
target-version = "py311"

# Line length
line-length = 100

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    "build",
    "dist",
	"ingestion/rust-ingestion/target",
]

[tool.ruff.lint]
# Enable rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]

# Ignore specific rules
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function call in argument defaults
    "W191",  # indentation contains tabs
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Auto-detect line endings
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["dags"]

[tool.pytest.ini_options]
testpaths = ["dags", "tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.poetry]
name = "cookiecutter-project-slug"
version = "0.1.0"
description = "Cryptocurrency data platform with Airflow, dbt, Kafka, and Rust"
authors = ["Greg"]
packages = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
apache-airflow = "^3.1.6"
apache-airflow-providers-docker = "^4.5.2"
redis = "^7.1.0"
psycopg2-binary = "^2.9.11"
docker = "^7.1.0"
langchain = "^1.2.10"
langchain-community = "^0.4.1"
langchain-ollama = "^1.0.1"
pgvector = "^0.4.2"
sqlalchemy = "^2.0.48"
langchain-anthropic = "^1.3.4"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
pytest-mock = "^3.15.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
