name: Security Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run secrets scan
        id: scan
        continue-on-error: true
        run: make security
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Ensure report exists
        if: always()
        run: |
          ls -l || true
          test -f gitleaks.json || echo '{}' > gitleaks.json

      - name: Upload Gitleaks JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json

      - name: Fail if Gitleaks found leaks and show report
        if: steps.scan.outcome == 'failure'
        run: |
          echo "****************************************"
          echo "** Gitleaks found leaks! Blocking PR. **"
          echo "****************************************"
          echo ""
          echo "--- Gitleaks Report (JSON) ---"
          cat gitleaks.json || true
          echo "------------------------------"
          exit 1
