name: CI - Lint & Test

on:
  pull_request:
    branches: ["*"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-python:
    name: 🐍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check '{{cookiecutter.project_slug}}/dags/'

      - name: Run ruff format check
        run: ruff format --check '{{cookiecutter.project_slug}}/dags/'

  lint-rust:
    name: 🦀 Lint - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: "api"
            name: "API"
          - project: "ingestion/rust-ingestion"
            name: "Ingestion"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            {{cookiecutter.project_slug}}/${{ matrix.project }}/target/
          key: ${{ runner.os }}-cargo-${{ matrix.project }}-${{ hashFiles(format('{{cookiecutter.project_slug}}/{0}/Cargo.lock', matrix.project)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.project }}-

      - name: Run cargo fmt
        working-directory: '{{cookiecutter.project_slug}}/${{ matrix.project }}'
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        working-directory: '{{cookiecutter.project_slug}}/${{ matrix.project }}'
        run: cargo clippy --all-targets --all-features

  test-python:
    name: 🐍 Tests
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run pytest
        run: |
          if [ -d "{{cookiecutter.project_slug}}/tests" ] || ls {{cookiecutter.project_slug}}/dags/test_*.py 2>/dev/null; then
            pytest {{cookiecutter.project_slug}}/dags/ --cov={{cookiecutter.project_slug}}/dags --cov-report=xml --cov-report=term
          else
            echo "No tests found, skipping..."
          fi

  test-rust:
    name: 🦀 tests - ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: lint-rust
    strategy:
      matrix:
        include:
          - project: "api"
            name: "API"
          - project: "ingestion/rust-ingestion"
            name: "Ingestion"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            {{cookiecutter.project_slug}}/${{ matrix.project }}/target/
          key: ${{ runner.os }}-cargo-${{ matrix.project }}-${{ hashFiles(format('{{cookiecutter.project_slug}}/{0}/Cargo.lock', matrix.project)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.project }}-

      - name: Run cargo test
        working-directory: '{{cookiecutter.project_slug}}/${{ matrix.project }}'
        run: cargo test --all-features --verbose

  summary:
    name: ✅ CI Summary
    runs-on: ubuntu-latest
    needs: [lint-python, lint-rust, test-python, test-rust]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.lint-python.result }}" != "success" ] || \
             [ "${{ needs.lint-rust.result }}" != "success" ] || \
             [ "${{ needs.test-python.result }}" != "success" ] || \
             [ "${{ needs.test-rust.result }}" != "success" ]; then
            echo "❌ CI failed"
            exit 1
          else
            echo "✅ All checks passed!"
          fi